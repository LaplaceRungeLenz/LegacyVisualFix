
name: Build and test

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and verify formatting
        run: bash ./gradlew build --no-daemon
      - name: Verify distribution contains inventory fixes
        run: python3 scripts/verify_release.py build/libs/legacyvisualfix-0.2.0.jar
