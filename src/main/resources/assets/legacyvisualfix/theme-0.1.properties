# LegacyVisualFix runtime resource reload screen. Edit and reload with F3+T.
enabled=true
showText=true
# Resource location, file:relative/path.png inside config/legacyvisualfix/, or empty for solid color.
texture.background=legacyvisualfix:textures/gui/background.png
texture.track=legacyvisualfix:textures/gui/bar_track.png
texture.fill=legacyvisualfix:textures/gui/bar_fill.png
background.fit=cover
# Bar center as fraction of screen; sizes in GUI-scale pixels, clamped to the viewport.
bar.x=0.5
bar.y=0.75
bar.width=240
bar.height=12
# RRGGBB or AARRGGBB. Texture colors multiply these tints; use FFFFFFFF for original artwork.
color.background=FF101820
color.track=FF2A3946
color.fill=FF59C9A5
color.text=FFE5EEF4
