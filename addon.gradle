// GTNH extension point: leave the upstream convention build script unchanged.
project.ext.modVersion = System.getenv('VERSION') ?: '0.2.2'
project.version = project.ext.modVersion

// Optional locally built ModernSplash runtime API, used only by client compatibility tests.
if (project.hasProperty('modernSplashJar')) {
    dependencies {
        devOnlyNonPublishable(rfg.deobf(project.files(project.property('modernSplashJar'))))
    }
}

// Explicit opt-in only. The smoke mod never belongs in a release jar.
if (project.hasProperty('clientSmoke')) {
    sourceSets.main.java.srcDir('src/smokeTest/java')
}
if (project.hasProperty('wailaSmoke')) {
    sourceSets.main.java.srcDir('src/wailaSmokeTest/java')
}
if (project.hasProperty('wdmlaSmoke')) {
    sourceSets.main.java.srcDir('src/wdmlaSmokeTest/java')
}
if (project.hasProperty('fovSmoke')) {
    sourceSets.main.java.srcDir('src/fovSmokeTest/java')
}
if (project.hasProperty('startupCompatSmoke')) {
    sourceSets.main.java.srcDir('src/startupSmokeTest/java')
}
if (project.hasProperty('inventorySmoke')) {
    sourceSets.main.java.srcDir('src/inventorySmokeTest/java')
}
if (project.hasProperty('uiSmoke')) {
    sourceSets.main.java.srcDir('src/uiSmokeTest/java')
}

if (project.hasProperty('vajraSmoke')) {
    sourceSets.main.java.srcDir('src/vajraSmokeTest/java')
}
if (project.hasProperty('combatSmoke')) {
    sourceSets.main.java.srcDir('src/combatSmokeTest/java')
}
// Pack QA classes are extracted to a separate temporary test mod, never shipped.
if (project.hasProperty('gtnhCombatQa')) {
    sourceSets.main.java.srcDir('src/gtnhCombatQa/java')
}
